    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1500px;
        height: 500px;
        overflow: hidden;
        background: #ccff00;
      }

      .banner {
        position: relative;
        width: 1500px;
        height: 500px;
        background: #ccff00;
        overflow: hidden;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #07080a;
      }

      /* X mobile/profile crops the outer edges. Keep all copy inside this inset. */
      .safe {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 96px 128px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        max-width: 920px;
      }

      .mark {
        width: 38px;
        height: 50px;
        margin-bottom: 22px;
        display: block;
      }

      h1 {
        font-size: 46px;
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -0.035em;
        margin-bottom: 14px;
      }

      p {
        font-size: 17px;
        line-height: 1.4;
        font-weight: 400;
        letter-spacing: -0.01em;
        max-width: 620px;
        margin-bottom: 22px;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #07080a;
        color: #ccff00;
        border-radius: 10px;
        padding: 9px 16px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .watermark {
        position: absolute;
        right: -90px;
        top: 50%;
        transform: translateY(-50%);
        width: 720px;
        height: auto;
        opacity: 0.16;
        pointer-events: none;
        z-index: 1;
      }
    </style>
